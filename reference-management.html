<!DOCTYPE html>
<html lang="en">

<head>
  <script src="system-lockout.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reference Details Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="reference-management.css">

    <!-- Content Security Policy -->
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com https://*.supabase.co; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co https://cdn.jsdelivr.net; object-src 'none'; base-uri 'self';">
</head>

<body class="bg-light">
    <!-- Navigation will be loaded here by nav.js -->
    <div class="container">
        <h2 class="text-center fw-bold mb-4">Reference Details Management</h2>
        <div class="row g-4">
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label fw-bold"><i class="bi bi-search"></i> Search References</label>
                            <div class="input-group">
                                <input type="text" class="form-control" placeholder="Search by name or ID...">
                                <button class="btn btn-outline-secondary" type="button"><i
                                        class="bi bi-funnel"></i></button>
                            </div>
                        </div>
                        <hr>
                        <h5 class="fw-bold mb-3"><i class="bi bi-person-lines-fill"></i> Reference Details</h5>

                        <div class="mb-2">
                            <label class="form-label">RID</label>
                            <input id="ref-rid" type="text" class="form-control" value="Auto-generated" disabled>
                            <small class="text-muted">RID will be automatically generated when you save</small>
                        </div>

                        <div class="mb-2">
                            <label class="form-label">Name <span class="text-danger">*</span></label>
                            <input id="ref-name" type="text" class="form-control" placeholder="Enter doctor/reference name (e.g. Dr. A. Perera)">
                        </div>

                        <div class="mb-2">
                            <label class="form-label">Assign Center</label>
                            <select id="ref-center" class="form-select">
                                <option value="">-- All Centers (Global) --</option>
                            </select>
                            <small class="text-muted">Leave blank to make reference usable by all centers</small>
                        </div>

                        <div class="mb-2">
                            <label class="form-label">Commission (%)</label>
                            <input id="ref-commission" type="number" step="0.01" min="0" max="100" class="form-control" placeholder="e.g. 5.00">
                        </div>

                        <div class="mb-2">
                            <label class="form-label">Phone</label>
                            <input id="ref-phone" type="tel" class="form-control" placeholder="e.g. 077-1234567">
                        </div>

                        <div class="mb-2">
                            <label class="form-label">Email</label>
                            <input id="ref-email" type="email" class="form-control" placeholder="e.g. dr.perera@example.com">
                        </div>

                        <div class="mb-2">
                            <label class="form-label">Address / Clinic</label>
                            <textarea id="ref-address" class="form-control" rows="2" placeholder="e.g. No. 23, Main St, Colombo"></textarea>
                        </div>

                        <div class="mb-3 form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="ref-active" checked>
                            <label class="form-check-label" for="ref-active">Active</label>
                        </div>

                        <div class="d-flex gap-2">
                            <button class="btn btn-primary flex-fill"><i class="bi bi-plus-lg"></i> Create New</button>
                            <button class="btn btn-success flex-fill"><i class="bi bi-save"></i> Save</button>
                            <button class="btn btn-danger flex-fill" disabled><i class="bi bi-trash"></i> Delete</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="fw-bold mb-0"><i class="bi bi-list-ul"></i> Reference List</h5>
                            <button class="btn btn-outline-primary btn-sm"><i class="bi bi-arrow-clockwise"></i>
                                Refresh</button>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-bordered align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th>RID</th>
                                        <th>Center</th>
                                        <th>Name / Clinic Address</th>
                                        <th>Contact</th>
                                        <th>Commission</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr><td colspan="7">Loading...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Supabase CDN -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <!-- Load configuration and services first -->
    <script src="config/config.js"></script>
    <script src="config/supabase.js"></script>
    <script src="js/services/billingService.js"></script>
    <script src="js/services/testService.js"></script>
    <script src="js/services/referenceService.js"></script>
    <script src="js/services/centerService.js"></script>
    <script src="js/services/packageService.js"></script>
    <script src="js/services/reportsService.js"></script>

    <!-- Load main app -->
    <script src="js/app.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/controllers/referenceController.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</body>

</html>
