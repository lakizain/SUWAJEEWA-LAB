<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Download Laboratory Report - Suwajeewa Laboratories</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f1f5f9; color: #172033; font-family: Arial, sans-serif; }
    .viewer { max-width: 720px; margin: 36px auto; padding: 24px; }
    .patient-heading { margin-bottom: 24px; }
    .patient-name { margin-bottom: 4px; font-size: 1.5rem; font-weight: 700; }
    .bill-date { color: #64748b; }
    .test-download-list { display: grid; gap: 12px; }
    .test-download-item { display: flex; align-items: center; gap: 16px; padding: 16px; background: white; border: 1px solid #dbe2ea; border-radius: 8px; }
    .test-download-item .btn { flex: 0 0 auto; }
    .test-name { margin: 0; font-weight: 600; }
    .pdf-render-area { position: fixed; top: 0; left: -10000px; width: 210mm; pointer-events: none; }
    .report-page { position: relative; display: flex; flex-direction: column; background: white; width: 210mm; height: 297mm; margin: 0; padding: 0; box-shadow: none; overflow: hidden; }
    .letterhead { position: absolute; left: 0; width: 100vw; z-index: 10; }
    .letterhead img { display: block; width: 100%; height: auto; }
    .letterhead-header { top: 0; }
    .letterhead-footer { bottom: 0; }
    .signature-section { position: absolute; right: 18mm; bottom: 31mm; display: flex; flex-direction: column; align-items: stretch; width: 32%; z-index: 30; }
    .signature-image { display: flex; align-items: flex-end; justify-content: center; width: 100%; height: 11mm; margin-bottom: 1mm; overflow: hidden; }
    .signature-image img { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; }
    .signature-line { width: 100%; height: 1px; border-bottom: 1px dashed #000; margin-bottom: 2px; }
    .signature-label { font-size: 14px; font-weight: 500; text-align: center; }
    .report-container { width: 100%; padding: 0 20px 51mm; box-sizing: border-box; }
    .content-area { flex: 1 0 auto; }
    .top-space { height: 50mm; }
    .report-info { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 14px; line-height: 1.4; margin-bottom: 4px; }
    .info-col { display: grid; grid-auto-rows: min-content; gap: 4px; }
    .info-col:last-child { margin-left: calc(15mm + 3px); }
    .info-row { display: grid; grid-template-columns: 180px 8px 1fr; align-items: baseline; }
    .info-col:first-child .info-row { grid-template-columns: 140px 8px 1fr; }
    .label { font-weight: 700; text-transform: uppercase; letter-spacing: .2px; white-space: nowrap; }
    .investigation-line { display: grid; grid-template-columns: 140px 8px 1fr; align-items: baseline; margin-top: 16px; font-size: 14px; line-height: 1.4; }
    .investigation-value { font-weight: 700; }
    .results-table { width: 100%; table-layout: fixed; border-collapse: separate; border-spacing: 0 1.5px; font-size: 14px; margin-top: 8px; line-height: 1.4; }
    .results-table th, .results-table td { border: none; padding: 3px 6px; vertical-align: top; }
    .results-table th { font-weight: 700; text-align: left; }
    .results-table td:first-child { font-size: 12px; white-space: nowrap; vertical-align: middle; }
    .results-table td:nth-child(2) { padding-left: 0; }
    .results-table td:nth-child(2)::before { content: ":"; display: inline-block; width: 10px; text-align: center; margin-right: 6px; }
    .results-table tr.hide-value-colon td:nth-child(2)::before { content: ""; }
    .remarks { margin-top: 18mm; font-size: 14px; line-height: 1.4; white-space: pre-wrap; }
    .footer-image { width: 100%; margin-top: 12mm; }
    .pdf-render-area .report-page { width: 210mm; height: 297mm; margin: 0; box-shadow: none; }
    .pdf-render-area .letterhead { width: 210mm; }
    .pdf-render-area .report-container { padding: 0 20px 51mm; }
    .pdf-render-area .top-space { height: 50mm; }
    .pdf-render-area .report-info { grid-template-columns: 1fr 1fr; padding: 0; }
    .pdf-render-area .info-col:last-child { margin-left: calc(15mm + 3px); }
    .pdf-render-area .info-row { grid-template-columns: 180px 8px 1fr; }
    .pdf-render-area .info-col:first-child .info-row { grid-template-columns: 140px 8px 1fr; }
    @media print {
      @page { size: A4; margin: 0; }
      body { background: white; }
      .viewer { max-width: none; margin: 0; padding: 0; }
      .no-print { display: none !important; }
      .report-page { width: 210mm; height: 297mm; min-height: 0; margin: 0; padding: 0; box-shadow: none; overflow: hidden; page-break-after: always; break-after: page; }
    }
    @media screen and (max-width: 850px) {
      .viewer { margin: 12px auto; padding: 12px; }
      .top-space { height: 180px; }
      .report-info { grid-template-columns: 1fr; padding: 0 12px; }
      .report-container { padding: 0 12px 160px; }
      .info-col:last-child { margin-left: 0; }
      .info-row, .info-col:first-child .info-row { grid-template-columns: 140px 8px 1fr; }
    }
    @media screen and (max-width: 850px) {
      .pdf-render-area .report-info { grid-template-columns: 1fr 1fr; padding: 0; }
      .pdf-render-area .info-col:last-child { margin-left: calc(15mm + 3px); }
      .pdf-render-area .report-container { padding: 0 20px 51mm; }
      .pdf-render-area .top-space { height: 50mm; }
    }
  </style>
</head>
<body>
  <main class="viewer">
    <div id="state" class="alert alert-info" role="status">Loading report…</div>
    <section id="patient-heading" class="patient-heading d-none">
      <h1 id="patient-name" class="patient-name"></h1>
      <div id="bill-date" class="bill-date"></div>
    </section>
    <div id="report-list" class="test-download-list"></div>
    <div id="pdf-render-area" class="pdf-render-area" aria-hidden="true"></div>
  </main>
  <script src="config/config.js"></script>
  <script src="config/supabase.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.2/html2pdf.bundle.min.js"></script>
  <script src="js/publicReport.js"></script>
</body>
</html>
